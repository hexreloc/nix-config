monitor = , preferred, auto, 1

$terminal = alacritty
$fileManager = nautilus
$menu = tofi-drun -c ~/.config/tofi/configA --drun-launch=true
$browser = firefox
$notes = emacs
$editor = nvim
$colorPicker = hyprpicker

exec-once = polkit-kde-authentication-agent-1
exec-once = dunst
exec-once = waybar
exec-once = awww-daemon
exec-once = awww img $HOME/nix-config/wallpapers/wall.jpg --transition-fps 255 --transition-type outer --transition-duration 0.8
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = hypridle
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = GDK_BACKEND,wayland,x11,*
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = QT_QPA_PLATFORM,wayland
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto

general {
	gaps_in = 5
		gaps_out = 5
		border_size = 1
		#col.active_border = rgb(8aadf4) rgb(24273A) rgb(24273A) rgb(8aadf4) 45deg
		#col.inactive_border = rgb(24273A) rgb(24273A) rgb(24273A) rgb(27273A) 45deg
		col.active_border = rgb(8aadf4) rgb(24273A) rgb(24273A) rgb(8aadf4) 
		col.inactive_border = rgb(24273A) rgb(24273A) rgb(24273A) rgb(27273A) 
		resize_on_border = true
		allow_tearing = false
		layout = dwindle
}

decoration {
	rounding = 2
		active_opacity = 1.0
		inactive_opacity = 1.0
		blur {
			enabled = true
				size = 3
				passes = 3
				new_optimizations = true
				vibrancy = 0.1696
				ignore_opacity = true
		}
}

animations {
	enabled = true
		bezier = wind, 0.05, 0.9, 0.1, 1.05
		bezier = winIn, 0.1, 1.1, 0.1, 1.1
		bezier = winOut, 0.3, -0.3, 0, 1
		bezier = liner, 1, 1, 1, 1
		animation = windows, 1, 6, wind, slide
		animation = windowsIn, 1, 6, winIn, slide
		animation = windowsOut, 1, 5, winOut, slide
		animation = windowsMove, 1, 5, wind, slide
		#animation = border, 1, 1, liner
		#animation = borderangle, 1, 30, liner, loop
		animation = fade, 1, 10, default
		animation = workspaces, 1, 5, wind
}


misc {
	force_default_wallpaper = 0
		disable_hyprland_logo = true
		disable_splash_rendering = true
		vrr = 0
}

input {
	kb_layout = us
		follow_mouse = 1
		sensitivity = 0
		repeat_rate = 50
		repeat_delay = 200

		touchpad {
			natural_scroll = true
		}
}

gestures {
	gesture = 3, horizontal, workspace
}

$mainMod = SUPER

bind = $mainMod, Return, exec, $terminal
bind = $mainMod, B, exec, $browser
bind = $mainMod, O, exec, $notes
bind = $mainMod, C, exec, $editor
bind = $mainMod, F, fullscreen
bind = $mainMod SHIFT, Q, killactive
bind = $mainMod, M, exit
bind = $mainMod, W, togglefloating
bind = $mainMod, D, exec, $menu
bind = $mainMod, E, exec, $filemanager
bind = $mainMod, R, exec, sh -c 'pkill waybar; waybar'

bind = $mainMod, Left, movefocus, l
bind = $mainMod, J, cyclenext, prev
bind = $mainMod, Right, movefocus, r
bind = $mainMod, Up, movefocus, u
bind = $mainMod, Down, movefocus, d

bind = $mainMod SHIFT, Left, movewindow, l
bind = $mainMod SHIFT, Right, movewindow, r
bind = $mainMod SHIFT, Up, movewindow, u
bind = $mainMod SHIFT, Down, movewindow, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod SHIFT, S, movetoworkspace, special:magic

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bindm = $mainMod, Z, movewindow
bindm = $mainMod, X, resizewindow

binde = $mainMod CTRL, Right, resizeactive, 30 0
binde = $mainMod CTRL, Left, resizeactive, -30 0
binde = $mainMod CTRL, Up, resizeactive, 0 -30
binde = $mainMod CTRL, Down, resizeactive, 0 30

bind = $mainMod, V, exec, cliphist list | tofi -c ~/.config/tofi/configV | cliphist decode | wl-copy
bind = $mainMod, P, exec, $colorPicker | wl-copy
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, Escape, exec, wlogout
bind = CTRL, Escape, exec, killall waybar || waybar

bind = , Print, exec, grimblast --notify copysave screen
bind = $mainMod, Print, exec, grimblast --notify copysave active
bind = $mainMod ALT, Print, exec, grimblast --notify copysave area

bind = , XF86AudioRaiseVolume, exec, pamixer -i 5
bind = , XF86AudioLowerVolume, exec, pamixer -d 5
bind = , XF86AudioMicMute, exec, pamixer --default-source -m
bind = , XF86AudioMute, exec, pamixer -t
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioPause, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

bind = , XF86MonBrightnessUp, exec, brightnessctl s +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl s 5%-

